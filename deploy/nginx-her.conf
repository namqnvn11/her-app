# HER — nginx: API chuyển tiếp sang Node cổng 4000; /var/www/her chỉ có nội dung khi chạy
# deploy.sh --with-web (bản web xem tạm). Có DuckDNS/tên miền thì chạy certbot, nó tự thêm khối 443.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/her;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    client_max_body_size 5m;

    # API -> Node (pm2 giữ chạy)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Web app 1 trang: đường dẫn nào không có file thì trả index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File build có hash trong tên -> cache lâu; index.html không cache
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
