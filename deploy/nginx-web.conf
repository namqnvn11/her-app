# HER — trang web chính (her-pilates.com): tĩnh tại /var/www/web, form gọi API ở api.her-pilates.com.
# Kích hoạt (sau khi DNS @ và www đã trỏ về server — xem huong-dan-deploy-aws.md):
#   sudo cp ~/her-app/deploy/nginx-web.conf /etc/nginx/sites-available/her-web
#   sudo ln -sf /etc/nginx/sites-available/her-web /etc/nginx/sites-enabled/her-web
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d her-pilates.com -d www.her-pilates.com --redirect -n
server {
    listen 80;
    listen [::]:80;
    server_name her-pilates.com www.her-pilates.com;

    root /var/www/web;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
